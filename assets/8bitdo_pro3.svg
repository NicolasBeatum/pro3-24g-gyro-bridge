<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2f3d"/>
      <stop offset="100%" stop-color="#191d27"/>
    </linearGradient>
    <linearGradient id="gripGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#222735"/>
      <stop offset="100%" stop-color="#13161f"/>
    </linearGradient>
    <linearGradient id="shoulderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c4458"/>
      <stop offset="100%" stop-color="#242936"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background subtle card -->
  <rect x="8" y="8" width="624" height="404" rx="22" fill="#0d1017" stroke="#222838" stroke-width="2"/>

  <!-- L2 / R2 Triggers -->
  <path d="M 118 58 Q 160 36 218 50 L 210 74 Q 160 66 122 78 Z" fill="url(#shoulderGrad)" stroke="#4c5670" stroke-width="1.5"/>
  <path d="M 522 58 Q 480 36 422 50 L 430 74 Q 480 66 518 78 Z" fill="url(#shoulderGrad)" stroke="#4c5670" stroke-width="1.5"/>
  <text x="165" y="61" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">L2</text>
  <text x="475" y="61" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">R2</text>

  <!-- L1 / R1 Bumpers + L4 / R4 inner shoulder buttons -->
  <path d="M 105 82 Q 158 66 226 76 L 222 96 Q 162 88 108 102 Z" fill="#2f3647" stroke="#47516b" stroke-width="1.5"/>
  <path d="M 535 82 Q 482 66 414 76 L 418 96 Q 478 88 532 102 Z" fill="#2f3647" stroke="#47516b" stroke-width="1.5"/>
  <rect x="228" y="76" width="32" height="17" rx="6" fill="#252c3b" stroke="#47516b" stroke-width="1.2"/>
  <rect x="380" y="76" width="32" height="17" rx="6" fill="#252c3b" stroke="#47516b" stroke-width="1.2"/>
  <text x="164" y="90" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">L1</text>
  <text x="476" y="90" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">R1</text>
  <text x="244" y="88" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">L4</text>
  <text x="396" y="88" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">R4</text>

  <!-- PL / PR Back Paddle hints (positioned cleanly inside the inner grip curve) -->
  <rect x="190" y="316" width="66" height="24" rx="8" fill="#142032" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2"/>
  <rect x="384" y="316" width="66" height="24" rx="8" fill="#142032" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="223" y="332" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">PL</text>
  <text x="417" y="332" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">PR</text>

  <!-- Left & Right Ergonomic Grips -->
  <path d="M 96 196 C 72 252 64 316 86 350 C 106 378 144 374 166 338 L 210 264 Z" fill="url(#gripGrad)" stroke="#384056" stroke-width="2"/>
  <path d="M 544 196 C 568 252 576 316 554 350 C 534 378 496 374 474 338 L 430 264 Z" fill="url(#gripGrad)" stroke="#384056" stroke-width="2"/>

  <!-- Main Pro 3 Body (SNES twin-circle + center bridge) -->
  <path d="M 172 94 L 468 94 C 522 94 562 134 562 184 C 562 234 522 274 468 274 L 424 274 C 400 294 372 300 320 300 C 268 300 240 294 216 274 L 172 274 C 118 274 78 234 78 184 C 78 134 118 94 172 94 Z"
        fill="url(#bodyGrad)" stroke="#444e68" stroke-width="2.2"/>

  <!-- Inner SNES-style face circles -->
  <circle cx="172" cy="184" r="70" fill="#1e222e" stroke="#31384b" stroke-width="1.5"/>
  <circle cx="468" cy="184" r="70" fill="#1e222e" stroke="#31384b" stroke-width="1.5"/>

  <!-- Center Brand & Status Bar -->
  <rect x="284" y="106" width="72" height="5" rx="2.5" fill="url(#accentCyan)" filter="url(#softGlow)"/>
  <text x="320" y="132" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">8BitDo PRO 3</text>
  <text x="320" y="148" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" text-anchor="middle">2.4 GHz · 200 Hz GYRO</text>

  <!-- Cross D-Pad (Left) -->
  <g fill="#12151e" stroke="#4d5773" stroke-width="1.8">
    <rect x="157" y="136" width="30" height="96" rx="6"/>
    <rect x="124" y="169" width="96" height="30" rx="6"/>
  </g>
  <circle cx="172" cy="184" r="10" fill="#1a1f2c"/>

  <!-- ABXY Face Buttons (Right) -->
  <g font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <!-- North (Y) -->
    <circle cx="468" cy="144" r="16" fill="#252b3b" stroke="#f59e0b" stroke-width="2"/>
    <text x="468" y="149" fill="#fbbf24">Y</text>
    <!-- South (A) -->
    <circle cx="468" cy="224" r="16" fill="#252b3b" stroke="#22c55e" stroke-width="2"/>
    <text x="468" y="229" fill="#4ade80">A</text>
    <!-- West (X) -->
    <circle cx="428" cy="184" r="16" fill="#252b3b" stroke="#3b82f6" stroke-width="2"/>
    <text x="428" y="189" fill="#60a5fa">X</text>
    <!-- East (B) -->
    <circle cx="508" cy="184" r="16" fill="#252b3b" stroke="#ef4444" stroke-width="2"/>
    <text x="508" y="189" fill="#f87171">B</text>
  </g>

  <!-- Center Buttons: Minus, Plus, Star, Home -->
  <g>
    <rect x="275" y="176" width="30" height="11" rx="5.5" transform="rotate(-24 290 181)" fill="#181c26" stroke="#525d7a" stroke-width="1.5"/>
    <rect x="335" y="176" width="30" height="11" rx="5.5" transform="rotate(-24 350 181)" fill="#181c26" stroke="#525d7a" stroke-width="1.5"/>
    <circle cx="290" cy="212" r="10" fill="#181c26" stroke="#525d7a" stroke-width="1.5"/>
    <text x="290" y="216" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">★</text>
    <circle cx="350" cy="212" r="10" fill="#181c26" stroke="#38bdf8" stroke-width="1.6"/>
    <circle cx="350" cy="212" r="4" fill="#38bdf8"/>
  </g>

  <!-- Symmetrical Analog Sticks -->
  <g>
    <circle cx="246" cy="260" r="34" fill="#12151d" stroke="#3c445c" stroke-width="2"/>
    <circle cx="246" cy="260" r="22" fill="#262c3c" stroke="#566282" stroke-width="1.8"/>
    <circle cx="246" cy="260" r="14" fill="#1b202d"/>

    <circle cx="394" cy="260" r="34" fill="#12151d" stroke="#3c445c" stroke-width="2"/>
    <circle cx="394" cy="260" r="22" fill="#262c3c" stroke="#566282" stroke-width="1.8"/>
    <circle cx="394" cy="260" r="14" fill="#1b202d"/>
  </g>

  <!-- Bottom LED indicator dots -->
  <g>
    <circle cx="302" cy="288" r="2.8" fill="#38bdf8"/>
    <circle cx="314" cy="288" r="2.8" fill="#38bdf8" opacity="0.45"/>
    <circle cx="326" cy="288" r="2.8" fill="#38bdf8" opacity="0.25"/>
    <circle cx="338" cy="288" r="2.8" fill="#38bdf8" opacity="0.25"/>
  </g>
</svg>
