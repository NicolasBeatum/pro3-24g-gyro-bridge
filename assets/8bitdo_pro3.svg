<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430">
  <!--
    8BitDo Pro 3 — minimalist outline schematic.
    Transparent background, stroke-only line art. Rendered by resvg in pro3-bridge/src/ui.rs.
