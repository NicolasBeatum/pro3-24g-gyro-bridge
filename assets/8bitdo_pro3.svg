    <circle cx="488" cy="242" r="13" stroke="#94A3B8" stroke-width="1.3"/>
    <path d="M 482.5 242.5 L 488 237.5 L 493.5 242.5 M 484.5 241 L 484.5 247 L 491.5 247 L 491.5 241"
