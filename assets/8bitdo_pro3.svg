    <!-- ===== Analog sticks ===== -->
    <g>
      <circle cx="234" cy="240" r="45" stroke="#94A3B8" stroke-width="1.5"/>
      <circle cx="234" cy="240" r="36" stroke="#64748B" stroke-width="1.1" stroke-opacity="0.8"/>
      <circle cx="234" cy="240" r="27" fill="#94A3B8" fill-opacity="0.06" stroke="#CBD5E1" stroke-width="1.5"/>
      <circle cx="234" cy="240" r="19" stroke="#64748B" stroke-width="1" stroke-opacity="0.7"/>
      <circle cx="234" cy="240" r="11" stroke="#64748B" stroke-width="0.9" stroke-opacity="0.5"/>
