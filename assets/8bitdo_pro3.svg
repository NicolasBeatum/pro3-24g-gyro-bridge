<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430">
  <!--
    Pro 2 / Pro 3 style front silhouette: brand-neutral minimalist line art (no text, no logos).
    Transparent background. Rendered by resvg in pro3-bridge/src/ui.rs; the live overlays in
    draw_pro3_controller are anchored on these coordinates, so keep both in sync:
      D-Pad (162,121) arms 44 x 15.5 | Face buttons r=18 at (478,78) (434,122) (522,122) (478,166)
      Minus (293,122) / Plus (347,122) pills 40x13 | Star (162,216) / Home (478,216) r=11
      Sticks (240,206) / (400,206) collar r=45 | L1/R1 bands y 28..35.5 | LEDs y=182
  -->
  <defs>
    <mask id="stick-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="640" height="430">
      <rect width="640" height="430" fill="#fff"/>
      <circle cx="240" cy="206" r="50" fill="#000"/>
      <circle cx="400" cy="206" r="50" fill="#000"/>
    </mask>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body silhouette -->
    <path d="M 320 40 L 162 40 A 108 108 0 0 0 54 148 C 54 200 53 252 55 298 C 58 344 65 382 80 403 C 95 424 133 426 148 407 C 161 390 170 354 181 324 C 191 297 212 286 242 286 C 268 286 292 278 320 278 C 348 278 372 286 398 286 C 428 286 449 297 459 324 C 470 354 479 390 492 407 C 507 426 545 424 560 403 C 575 382 582 344 585 298 C 587 252 586 200 586 148 A 108 108 0 0 0 478 40 L 320 40 Z" fill="#94A3B8" fill-opacity="0.05" stroke="#94A3B8" stroke-width="2.4"/>
    <!-- Dogbone faceplate seam (masked around the stick housings) -->
    <path d="M 162 50 L 478 50 A 98 98 0 1 1 434.87 236 L 205.13 236 A 98 98 0 1 1 162 50 Z" stroke="#94A3B8" stroke-width="1.2" stroke-opacity="0.38" mask="url(#stick-cut)"/>
    <!-- Shoulders: L1 / R1 bumpers + L4 / R4 tabs -->
    <g stroke="#94A3B8" stroke-width="1.6">
      <path d="M 206 35.5 L 162 35.5 A 112.5 112.5 0 0 0 62.67 95.18 A 3.75 3.75 0 0 1 56.05 91.66 A 120 120 0 0 1 162 28 L 203 28 Q 206 28 206 31 Z"/>
      <path d="M 434 35.5 L 478 35.5 A 112.5 112.5 0 0 1 577.33 95.18 A 3.75 3.75 0 0 0 583.95 91.66 A 120 120 0 0 0 478 28 L 437 28 Q 434 28 434 31 Z"/>
      <rect x="216" y="28.5" width="26" height="7" rx="3.5"/>
      <rect x="398" y="28.5" width="26" height="7" rx="3.5"/>
    </g>
    <!-- Controls -->
    <g stroke="#8B9BB2" stroke-width="1.6">
      <path d="M 150.5 77 L 173.5 77 Q 177.5 77 177.5 81 L 177.5 103 Q 177.5 105.5 180 105.5 L 202 105.5 Q 206 105.5 206 109.5 L 206 132.5 Q 206 136.5 202 136.5 L 180 136.5 Q 177.5 136.5 177.5 139 L 177.5 161 Q 177.5 165 173.5 165 L 150.5 165 Q 146.5 165 146.5 161 L 146.5 139 Q 146.5 136.5 144 136.5 L 122 136.5 Q 118 136.5 118 132.5 L 118 109.5 Q 118 105.5 122 105.5 L 144 105.5 Q 146.5 105.5 146.5 103 L 146.5 81 Q 146.5 77 150.5 77 Z"/>
      <circle cx="478" cy="78" r="18"/>
      <circle cx="434" cy="122" r="18"/>
      <circle cx="522" cy="122" r="18"/>
      <circle cx="478" cy="166" r="18"/>
      <rect x="273" y="115.5" width="40" height="13" rx="6.5"/>
      <rect x="327" y="115.5" width="40" height="13" rx="6.5"/>
      <circle cx="162" cy="216" r="11"/>
      <circle cx="478" cy="216" r="11"/>
      <circle cx="240" cy="206" r="45"/>
      <circle cx="400" cy="206" r="45"/>
    </g>
    <g fill="#8B9BB2" fill-opacity="0.55">
      <circle cx="310" cy="182" r="2"/>
      <circle cx="320" cy="182" r="2"/>
      <circle cx="330" cy="182" r="2"/>
    </g>
  </g>
</svg>
