    <circle cx="152" cy="242" r="12.5" stroke="#94A3B8" stroke-width="1.3"/>
    <polygon points="152,235.5 153.59,239.82 158.18,239.99 154.57,242.83 155.82,247.26 152,244.7 148.18,247.26 149.43,242.83 145.82,239.99 150.41,239.82"
