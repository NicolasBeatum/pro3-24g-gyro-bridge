  <g fill="#131722">
    <path d="M 61.395 67.87 h 11.55 v 11.165000000000001 h 11.165000000000001 v 11.55 h -11.165000000000001 v 11.165000000000001 h -11.55 v -11.165000000000001 h -11.165000000000001 v -11.55 h 11.165000000000001 Z"/>
    <circle cx="188.83" cy="68.25" r="6.54"/>
    <circle cx="171.89" cy="85.19" r="6.54"/>
    <circle cx="205.77" cy="85.19" r="6.54"/>
    <circle cx="188.83" cy="102.13" r="6.54"/>
    <circle cx="97.20" cy="117.53" r="14.63"/>
    <circle cx="158.80" cy="117.53" r="14.63"/>
